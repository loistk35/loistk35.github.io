<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDT Peru - Página Principal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <!-- BARRA LATERAL (Menú de Navegación estilo Google Sites) -->
    <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col justify-between z-20">
        <div>
            <!-- Logo / Título del sitio -->
            <div class="p-6 border-b border-slate-100">
                <span class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">TDT Peru</span>
            </div>
            
            <!-- Hipervínculos de navegación -->
            <nav class="p-4 space-y-1">
                <a href="index.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl bg-indigo-50 text-indigo-600 font-semibold transition">
                    🏠 Página Principal
                </a>
                <a href="privacidad.html" class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
                    🔒 Política de Privacidad
                </a>
            </nav>
        </div>

        <!-- Pie de la barra lateral -->
        <div class="p-4 border-t border-slate-100 text-xs text-slate-400">
            &copy; 2026 Tgs Business
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="flex-1 flex flex-col overflow-y-auto">
        
        <!-- Barra superior para móviles -->
        <header class="bg-white border-b border-slate-200 p-4 md:hidden flex justify-between items-center">
            <span class="font-bold text-indigo-600">TDT Peru</span>
            <div class="space-x-2 text-sm">
                <a href="index.html" class="font-semibold text-indigo-600">Inicio</a>
                <a href="privacidad.html" class="text-slate-600">Privacidad</a>
            </div>
        </header>

        <!-- Cuerpo de Bienvenida -->
        <main class="flex-1 flex items-center justify-center p-6">
            <div class="max-w-xl w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 md:p-12 text-center">
                
                <div class="mx-auto w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mb-6 text-indigo-600 shadow-inner">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>

                <h1 class="text-3xl font-extrabold text-slate-900 mb-3">¡Bienvenido a TDT Peru!</h1>
                <p class="text-slate-600 text-sm mb-8 leading-relaxed">
                    Gracias por descargar nuestra aplicación. Disfruta de todo nuestro contenido y explora las opciones de navegación lateral.
                </p>

                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <button onclick="saludar()" class="py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md transition">
                        Comenzar
                    </button>
                    <a href="privacidad.html" class="py-3 px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition flex items-center justify-center">
                        Política de Privacidad →
                    </a>
                </div>

                <p id="mensaje" class="mt-4 text-sm text-indigo-600 font-medium opacity-0 transition-opacity duration-300"></p>

            </div>
        </main>
    </div>

    <script>
        function saludar() {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = "¡Todo listo para la mejor experiencia! 🚀";
            mensaje.classList.remove('opacity-0');
        }
    </script>

</body>
</html>

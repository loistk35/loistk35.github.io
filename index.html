<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20 text-center transform transition duration-500 hover:scale-[1.01]">
        
        <!-- Icono o Logo -->
        <div class="mx-auto w-16 h-16 bg-indigo-500 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/50">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>

        <!-- Título -->
        <h1 class="text-3xl font-extrabold tracking-tight mb-2">¡Bienvenido!</h1>
        
        <!-- Subtítulo -->
        <p class="text-gray-300 text-sm mb-6 leading-relaxed">
            Nos alegra mucho tenerte por aquí. Explora nuestro contenido y descubre todo lo que tenemos preparado para ti.
        </p>

        <!-- Botón de acción -->
        <button onclick="saludar()" class="w-full py-3 px-6 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg transition duration-300 transform hover:-translate-y-0.5 active:translate-y-0">
            Comenzar
        </button>

        <!-- Mensaje dinámico -->
        <p id="mensaje" class="mt-4 text-sm text-indigo-300 font-medium opacity-0 transition-opacity duration-300"></p>

    </div>

    <!-- Script de interacción simple -->
    <script>
        function saludar() {
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = "¡Genial! Prepárate para una gran experiencia. 🚀";
            mensaje.classList.remove('opacity-0');
        }
    </script>

</body>
</html>
